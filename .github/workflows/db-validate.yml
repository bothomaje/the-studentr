name: DB Validate
on:
  push:
    paths:
      - 'db/**'
      - 'scripts/**'
      - 'app/dal/**'
      - 'app/config/env.py'
      - 'requirements.txt'
      - '.github/workflows/db-validate.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/**'
      - 'app/dal/**'
      - 'app/config/env.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      SA_DB_HOST: 127.0.0.1
      SA_DB_PORT: 3306
      SA_DB_USER: root
      SA_DB_PASS: ${{ secrets.CI_DB_ROOT_PASS }}
      SA_DB_NAME: the_studentr
      
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependancy-path: requirements.txt

      - name: Build deps for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Setup DB
        run: python -m scripts.setup_db

      - name: DAL smoke
        run: python -m scripts.dal_smoke

      - name: Users DAL smoke
        run: |
          python - <<'PY'
          from app.dal.users_dal import get_user_by_username
          email = get_user_by_username("testuser1")["email"]
          print(email)
          PY

      - name: Modules DAL smoke
        run: |
          python - <<'PY'
          from app.dal.base import db_conn, fetch_one
          from app.dal.modules_dal import list_modules_for_user, list_modules_dashboard
          with db_conn() as c:
            uid = fetch_one(c, "SELECT user_id FROM USERS LIMIT 1")["user_id"]
          assert list_modules_for_user(uid), "No modules for seeded user"
          dash = list_modules_dashboard(uid)
          assert isinstance(dash, list) and len(dash) >= 1
          print("Modules DAL OK:", [m["module_code"] for m in dash])
          PY

      - name: Assignments DAL smoke
        run: |
          python - <<'PY'
          from datetime import date, timedelta
          from app.dal.base import db_conn, fetch_one
          from app.dal.assignments_dal import list_upcoming_for_user, create_assignment, delete_assignment

          with db_conn() as c:
            uid = fetch_one(c, "SELECT user_id FROM USERS LIMIT 1")["user_id"]
            mid = fetch_one(c, "SELECT module_id FROM MODULES WHERE user_id=%s LIMIT 1", (uid,))["module_id"]

          aid = create_assignment(module_id=mid, category="Formative", assignment_type="Quiz", assignment_title="CI Smoke", due_date=date.today()+timedelta(days=1))
          try:
            rows = list_upcoming_for_user(uid, days=2)
            assert any(r["assignment_id"] == aid for r in rows)
            print("Assignments DAL OK — upcoming includes CI Smoke")
          finally:
            delete_assignment(aid)
          PY

      - name: Marks DAL smoke
        run: |
          python - <<'PY'
          from datetime import date
          from app.dal.base import db_conn, fetch_one
          from app.dal.assignments_dal import create_assignment
          from app.dal.marks_dal import insert_mark, update_mark_score, compute_category_averages, delete_mark_by_assignment

          with db_conn() as c:
            uid = fetch_one(c, "SELECT user_id FROM USERS LIMIT 1")["user_id"]
            mid = fetch_one(c, "SELECT module_id FROM MODULES WHERE user_id=%s LIMIT 1", (uid,))["module_id"]

          aid = create_assignment(module_id=mid, category="Formative", assignment_type="Quiz", assignment_title="CI Marks", due_date=date.today())
          try:
            insert_mark(assignment_id=aid, weight=25.0, score=None)
            insert_mark(assignment_id=aid, weight=25.0, score=75.0)
            avg = compute_category_averages(mid)
            assert "year_mark" in avg
            print("Marks DAL OK — avg:", avg)
          finally:
            delete_mark_by_assignment(aid)
          PY
