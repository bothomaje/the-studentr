name: DB Validate
on:
  push:
    paths:
      - 'db/**'
      - 'scripts/**'
      - 'app/dal/**'
      - 'app/config/env.py'
      - 'requirements.txt'
      - '.github/workflows/db-validate.yml'
  pull_request:
    paths:
      - 'db/**'
      - 'scripts/**'
      - 'app/dal/**'
      - 'app/config/env.py'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASS }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      SA_DB_HOST: 127.0.0.1
      SA_DB_PORT: 3306
      SA_DB_USER: root
      SA_DB_PASS: ${{ secrets.CI_DB_ROOT_PASS }}
      SA_DB_NAME: the_studentr
      
    steps:
      - uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependancy-path: requirements.txt

      - name: Build deps for mysqlclient
        run: sudo apt-get update && sudo apt-get install -y libmysqlclient-dev

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Setup DB
        run: python -m scripts.setup_db

      - name: DAL smoke
        run: python -m scripts.dal_smoke

      - name: Run CI smoke
        run: python -m scripts.ci_smoke

      - name: Run unit tests
        run: |
          pip install pytest
          pytest -q
