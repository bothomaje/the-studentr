name: Render PlantUML

on:
  push:
    paths:
      - 'docs/diagrams/**/*.puml'
      - '.github/workflows/plantuml.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download PlantUML
        run: curl -L -o plantuml.jar https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render puml to svg
        run: |
          find docs/diagrams -name '*.puml' -print0 | while IFS= read -r -d '' f; do
            java -jar plantuml.jar -tsvg "$f"
          done

      - name: Commit rendered SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(diagrams): render PlantUML"
          file_pattern: docs/diagrams/*.svg
