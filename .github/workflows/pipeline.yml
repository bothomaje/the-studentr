---
name: Pipeline

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_all:
        description: |
          "Force run all jobs (ignore change detection)"
        required: false
        type: boolean
        default: false
      full_lint:
        description: "Force full-repo lint scope"
        required: false
        type: boolean
        default: false
      enforce_sqlfluff:
        description: "Fail on SQLFluff violations (0/1)"
        required: false
        type: choice
        options: ["0", "1"]
        default: "0"

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      py_changed: ${{ steps.filter.outputs.py }}
      py_files: ${{ steps.filter.outputs.py_files }}
      uml_changed: ${{ steps.filter.outputs.uml }}
      db_changed: ${{ steps.filter.outputs.db }}
      ui_logic_changed: ${{ steps.filter.outputs.ui }}
      yaml_files: ${{ steps.filter.outputs.yaml_files }}
      yaml_changed: ${{ steps.filter.outputs.yaml }}
      sh_files: ${{ steps.filter.outputs.sh_files }}
      sql_changed: ${{ steps.filter.outputs.sql }}
      sql_files: ${{ steps.filter.outputs.sql_files }}
    steps:
      - uses: actions/checkout@v4

      - name: Install jq for summaries
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Paths filter
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: json
          filters: |
            py:
              - 'app/**/*.py'
              - 'scripts/**/*.py'
              - 'tests/**/*.py'
            db:
              - 'db/**'
              - 'scripts/**'
              - 'app/dal/**'
              - 'app/config/env.py'
              - 'requirements.txt'
            uml:
              - 'docs/diagrams/**/*.puml'
            ui:
              - 'app/ui_adapters/**/*.py'
              - 'app/**/*.ui'
              - 'app/**/*.qml'
              - 'app/**/*.py'
              - '!app/dal/**'
              - '!app/config/**'
            yaml:
              - '**/*.y?(a)ml'
            sh:
              - '**/*.sh'
            sql:
              - 'db/**/*.sql'
              - 'scripts/**/*.sql'

      - name: Summary
        env:
          RUN_ALL: ${{ github.event.inputs.run_all || 'false' }}
          FULL_LINT: ${{ github.event.inputs.full_lint || 'false' }}
          PY_CHANGED: ${{ steps.filter.outputs.py }}
          DB_CHANGED: ${{ steps.filter.outputs.db }}
          UML_CHANGED: ${{ steps.filter.outputs.uml }}
          UI_CHANGED: ${{ steps.filter.outputs.ui }}
          YAML_CHANGED: ${{ steps.filter.outputs.yaml }}
          PY_FILES: ${{ steps.filter.outputs.py_files }}
          YAML_FILES: ${{ steps.filter.outputs.yaml_files }}
          SH_FILES: ${{ steps.filter.outputs.sh_files }}
          SQL_CHANGED: ${{ steps.filter.outputs.sql }}
          SQL_FILES: ${{ steps.filter.outputs.sql_files }}
        run: |
          {
            printf '%s\n' '## Change detection' ''
            printf '%s\n' "- Manual override (run_all): **$RUN_ALL**"
            printf '%s\n' "- Force full lint: **$FULL_LINT**" ''
            printf '%s\n' "- Python changed: **$PY_CHANGED**"
            printf '%s\n' "- DB/DAL/config changed: **$DB_CHANGED**"
            printf '%s\n' "- UML changed: **$UML_CHANGED**"
            printf '%s\n' "- UI/Logic changed: **$UI_CHANGED**"
            printf '%s\n' "- YAML changed: **$YAML_CHANGED**"
            printf '%s\n' "- SQL changed: **$SQL_CHANGED**"
            printf '%s\n' ''
            printf '%s\n' '<details><summary>Changed Python files</summary>' ''
            echo "$PY_FILES" | jq -r '.[]?'
            printf '%s\n' '</details>'
            printf '%s\n' '<details><summary>Changed YAML files</summary>' ''
            echo "$YAML_FILES" | jq -r '.[]?'
            printf '%s\n' '</details>'
            printf '%s\n' '<details><summary>Changed Shell scripts</summary>' ''
            echo "$SH_FILES" | jq -r '.[]?'
            printf '%s\n' '</details>'
            printf '%s\n' '<details><summary>Changed SQL files</summary>' ''
            echo "$SQL_FILES" | jq -r '.[]?'
            printf '%s\n' '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint
    needs: detect
    runs-on: ubuntu-latest
    env:
      PY_CHANGED: ${{ needs.detect.outputs.py_changed }}
      PY_FILES: ${{ needs.detect.outputs.py_files }}
      YAML_FILES: ${{ needs.detect.outputs.yaml_files }}
      SH_FILES: ${{ needs.detect.outputs.sh_files }}
      ENFORCE_SQLFLUFF: ${{ github.event.inputs.enforce_sqlfluff || '0' }}
      FORCE_FULL_LINT: ${{ github.event.inputs.full_lint || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.6.*
          sudo apt-get update
          sudo apt-get install -y yamllint shellcheck jq
          pip install "sqlfluff==3.*"

      - name: Lint baseline cache
        id: lintcache
        uses: actions/cache@v4
        with:
          path: .cache/lint-baseline
          key: lint-baseline-v1

      - name: Ensure baseline dir
        run: mkdir -p .cache/lint-baseline

      - name: Decide scope
        id: scope
        shell: bash
        env:
          FORCE_FULL_LINT: ${{ env.FORCE_FULL_LINT }}
        run: |
          FIRST_RUN="false"
          if [ "${{ steps.lintcache.outputs.cache-hit }}" != "true" ]; then
            FIRST_RUN="true"
          fi
          if [ "$FORCE_FULL_LINT" = "true" ]; then
            FIRST_RUN="true"
          fi
          echo "first_run=$FIRST_RUN" >> "$GITHUB_OUTPUT"
          {
            echo "## Lint scope"
            if [ "$FIRST_RUN" = "true" ]; then
              echo "Full repo (baseline or manual force)."
            else
              echo "Changed files only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run ruff (full)
        if: steps.scope.outputs.first_run == 'true'
        run: |
          set +e
          ruff check . --output-format=json > ruff-output.json 2>&1
          RUFF_EXIT_CODE=$?
          set -e

          if [ $RUFF_EXIT_CODE -ne 0 ]; then
            echo "RUFF_FAILED=true" >> "$GITHUB_ENV"
            echo "RUFF_OUTPUT_FILE=ruff-output.json" >> "$GITHUB_ENV"
            exit $RUFF_EXIT_CODE
          else
            echo "RUFF_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: Run ruff (changed)
        if: steps.scope.outputs.first_run != 'true' && env.PY_CHANGED == 'true'
        run: |
          set +e
          python - <<'PY'
          import json, os, subprocess, sys
          files = json.loads(os.environ.get("PY_FILES", "[]"))
          if files:
              try:
                  result = subprocess.run(["ruff", "check", "--output-format=json"] + files,
                                        capture_output=True, text=True)
                  with open("ruff-output.json", "w") as f:
                      f.write(result.stdout)
                  if result.returncode != 0:
                      print(f"RUFF_FAILED=true", file=open(os.environ["GITHUB_ENV"], "a"))
                      print(f"RUFF_OUTPUT_FILE=ruff-output.json", file=open(os.environ["GITHUB_ENV"], "a"))
                  else:
                      print(f"RUFF_FAILED=false", file=open(os.environ["GITHUB_ENV"], "a"))
                  sys.exit(result.returncode)
              except Exception as e:
                  print(f"Error running ruff: {e}")
                  sys.exit(1)
          else:
              print("No changed Python files")
              print(f"RUFF_FAILED=false", file=open(os.environ["GITHUB_ENV"], "a"))
          PY

      - name: YAML lint (full)
        if: steps.scope.outputs.first_run == 'true'
        run: |
          set +e
          yamllint -s . > yamllint-output.txt 2>&1
          YAML_EXIT_CODE=$?
          set -e

          if [ $YAML_EXIT_CODE -ne 0 ]; then
            echo "YAMLLINT_FAILED=true" >> "$GITHUB_ENV"
            echo "YAMLLINT_OUTPUT_FILE=yamllint-output.txt" >> "$GITHUB_ENV"
            exit $YAML_EXIT_CODE
          else
            echo "YAMLLINT_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: YAML lint (changed)
        if: steps.scope.outputs.first_run != 'true' && env.YAML_FILES != ''
        run: |
          set +e
          python - <<'PY'
          import json, os, subprocess, sys
          files = json.loads(os.environ.get("YAML_FILES", "[]"))
          if files:
              try:
                  result = subprocess.run(["yamllint", "-s"] + files,
                                        capture_output=True, text=True)
                  with open("yamllint-output.txt", "w") as f:
                      f.write(result.stdout + result.stderr)
                  if result.returncode != 0:
                      print(f"YAMLLINT_FAILED=true", file=open(os.environ["GITHUB_ENV"], "a"))
                      print(f"YAMLLINT_OUTPUT_FILE=yamllint-output.txt", file=open(os.environ["GITHUB_ENV"], "a"))
                  else:
                      print(f"YAMLLINT_FAILED=false", file=open(os.environ["GITHUB_ENV"], "a"))
                  sys.exit(result.returncode)
              except Exception as e:
                  print(f"Error running yamllint: {e}")
                  sys.exit(1)
          else:
              print("No changed YAML files")
              print(f"YAMLLINT_FAILED=false", file=open(os.environ["GITHUB_ENV"], "a"))
          PY

      - name: ShellCheck (full)
        if: steps.scope.outputs.first_run == 'true'
        run: |
          set +e
          shopt -s globstar nullglob
          files=( **/*.sh )
          if (( ${#files[@]} )); then
            shellcheck "${files[@]}" > shellcheck-output.txt 2>&1
            SHELL_EXIT_CODE=$?
            if [ $SHELL_EXIT_CODE -ne 0 ]; then
              echo "SHELLCHECK_FAILED=true" >> "$GITHUB_ENV"
              echo "SHELLCHECK_OUTPUT_FILE=shellcheck-output.txt" >> "$GITHUB_ENV"
              exit $SHELL_EXIT_CODE
            else
              echo "SHELLCHECK_FAILED=false" >> "$GITHUB_ENV"
            fi
          else
            echo "No shell scripts."
            echo "SHELLCHECK_FAILED=false" >> "$GITHUB_ENV"
          fi

      - name: ShellCheck (changed)
        if: steps.scope.outputs.first_run != 'true' && env.SH_FILES != ''
        run: |
          set +e
          python - <<'PY'
          import json, os, subprocess, sys
          files = json.loads(os.environ.get("SH_FILES", "[]"))
          if files:
              try:
                  result = subprocess.run(["shellcheck"] + files,
                                        capture_output=True, text=True)
                  with open("shellcheck-output.txt", "w") as f:
                      f.write(result.stdout + result.stderr)
                  if result.returncode != 0:
                      print(f"SHELLCHECK_FAILED=true", file=open(os.environ["GITHUB_ENV"], "a"))
                      print(f"SHELLCHECK_OUTPUT_FILE=shellcheck-output.txt", file=open(os.environ["GITHUB_ENV"], "a"))
                  else:
                      print(f"SHELLCHECK_FAILED=false", file=open(os.environ["GITHUB_ENV"], "a"))
                  sys.exit(result.returncode)
              except Exception as e:
                  print(f"Error running shellcheck: {e}")
                  sys.exit(1)
          else:
              print("No changed shell scripts")
              print(f"SHELLCHECK_FAILED=false", file=open(os.environ["GITHUB_ENV"], "a"))
          PY

      - name: Ensure .sqlfluff (mysql)
        run: |
          if [ ! -f .sqlfluff ]; then
            printf '%s\n' '[sqlfluff]' 'dialect = mysql' \
              'max_line_length = 100' > .sqlfluff
          fi

      - name: SQLFluff (full)
        if: steps.scope.outputs.first_run == 'true'
        run: |
          set +e
          sqlfluff lint db scripts \
            --format json \
            --write-output sqlfluff.json
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi
          VIOL=$(jq 'map(.violations|length)|add // 0' sqlfluff.json)
          echo "VIOL=$VIOL" >> "$GITHUB_ENV"
          if [ "${ENFORCE_SQLFLUFF:-0}" = "1" ] && [ "$VIOL" -ne 0 ]; then
            exit 1
          fi

      - name: SQLFluff (changed)
        if: >
          steps.scope.outputs.first_run != 'true' &&
          needs.detect.outputs.sql_changed == 'true'
        env:
          SQL_FILES: ${{ needs.detect.outputs.sql_files }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          files = json.loads(os.environ.get("SQL_FILES","[]"))
          if not files:
              sys.exit(0)
          rc = subprocess.call([
              "sqlfluff","lint","--format","json",
              "--write-output","sqlfluff.json", *files
          ])
          # rc: 0=clean, 1=violations, >1=error (fail on >1)
          sys.exit(0 if rc in (0,1) else rc)
          PY
          if [ -f sqlfluff.json ]; then
            VIOL=$(jq 'map(.violations|length)|add // 0' sqlfluff.json)
            echo "VIOL=$VIOL" >> "$GITHUB_ENV"
            if [ "${ENFORCE_SQLFLUFF:-0}" = "1" ] && [ "$VIOL" -ne 0 ]; then
              exit 1
            fi
          else
            echo "VIOL=0" >> "$GITHUB_ENV"
          fi

      - name: SQLFluff defaults when skipped
        if: env.VIOL == ''
        run: echo "VIOL=0" >> "$GITHUB_ENV"

      - name: Mark baseline
        if: steps.scope.outputs.first_run == 'true' && success()
        run: |
          mkdir -p .cache/lint-baseline
          printf 'ok' > .cache/lint-baseline/marker

      - name: Upload lint artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-failure-logs
          path: |
            ruff-output.json
            yamllint-output.txt
            shellcheck-output.txt
            sqlfluff.json
          if-no-files-found: ignore

      - name: Summary
        if: always()
        env:
          STATUS: ${{ job.status }}
        run: |
          {
            printf '## Lint Results: **%s**\n\n' "$STATUS"

            # Add timing information
            printf '**Job started:** %s\n' "$(date --iso-8601=seconds)"

            # Ruff results
            printf '\n### 🐍 Python (Ruff)\n'
            if [ "${RUFF_FAILED:-false}" = "true" ] && [ -f "${RUFF_OUTPUT_FILE:-}" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>Ruff violations</summary>\n\n'
              printf '```json\n'
              cat "${RUFF_OUTPUT_FILE}" || echo "No output file found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # YAML lint results
            printf '\n### 📄 YAML (yamllint)\n'
            if [ "${YAMLLINT_FAILED:-false}" = "true" ] && [ -f "${YAMLLINT_OUTPUT_FILE:-}" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>YAML violations</summary>\n\n'
              printf '```\n'
              cat "${YAMLLINT_OUTPUT_FILE}" || echo "No output file found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # ShellCheck results
            printf '\n### 🐚 Shell (ShellCheck)\n'
            if [ "${SHELLCHECK_FAILED:-false}" = "true" ] && [ -f "${SHELLCHECK_OUTPUT_FILE:-}" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>ShellCheck violations</summary>\n\n'
              printf '```\n'
              cat "${SHELLCHECK_OUTPUT_FILE}" || echo "No output file found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # SQLFluff results
            printf '\n### 🗃️ SQL (SQLFluff)\n'
            printf '**Status:** %s\n' "$STATUS"
            printf '**Violations:** %s\n' "${VIOL:-0}"

            if [ -f sqlfluff.json ]; then
              printf '\n<details><summary>Files with issues</summary>\n\n'
              jq -r '.[] as $f | $f.violations[] |
                "- \($f.filepath):\(.line_no):\(.line_pos) \(.code): \(.description)"' \
                sqlfluff.json >> "$GITHUB_STEP_SUMMARY"
              printf '\n</details>\n'
            else
              printf '\n_No SQL changes or report absent._\n'
            fi

            # Overall summary
            printf '\n---\n'
            if [ "$STATUS" = "success" ]; then
              printf '🎉 All linting checks passed!\n'
            else
              printf '❌ Some linting checks failed. Please review the details above.\n'
              printf '\n**Next steps:**\n'
              printf '1. Review the specific violations in each section\n'
              printf '2. Fix the issues locally\n'
              printf '3. Re-run the linters: `ruff check .`, `yamllint .`, `shellcheck **/*.sh`,\n'
              printf '   `sqlfluff lint db scripts`\n'
              printf '4. Commit and push your fixes\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  plantuml:
    name: Render UML
    needs: lint
    if: >-
      ${{
        github.event.inputs.run_all == 'true' ||
        needs.detect.outputs.uml_changed == 'true'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download PlantUML
        run: |
          curl -L -o plantuml.jar \
            https://github.com/plantuml/plantuml/releases/latest/download/plantuml.jar

      - name: Render .puml to .svg
        run: |
          find docs/diagrams -name '*.puml' -print0 \
            | while IFS= read -r -d '' f; do
                java -jar plantuml.jar -tsvg "$f";
              done

      - name: Commit rendered SVGs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(diagrams): render PlantUML"
          file_pattern: docs/diagrams/*.svg

      - name: Summary – PlantUML
        run: |
          echo "### PlantUML rendered and committed ✅" >> "$GITHUB_STEP_SUMMARY"

  db-validate:
    name: Validate Data Model
    needs: lint
    if: >-
      ${{
        github.event.inputs.run_all == 'true' ||
        needs.detect.outputs.db_changed == 'true'
      }}
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:9.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_ROOT_PASS }}
          MYSQL_DATABASE: the_studentr
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -p$MYSQL_ROOT_PASSWORD"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      SA_DB_HOST: 127.0.0.1
      SA_DB_PORT: 3306
      SA_DB_USER: root
      SA_DB_PASS: ${{ secrets.CI_DB_ROOT_PASS }}
      SA_DB_NAME: the_studentr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Build deps for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y libmysqlclient-dev

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Setup DB
        run: |
          set +e
          python -m scripts.setup_db > db-setup.log 2>&1
          DB_SETUP_EXIT_CODE=$?
          set -e

          if [ $DB_SETUP_EXIT_CODE -ne 0 ]; then
            echo "DB_SETUP_FAILED=true" >> "$GITHUB_ENV"
            echo "Database setup failed. Check db-setup.log for details."
            cat db-setup.log
            exit $DB_SETUP_EXIT_CODE
          else
            echo "DB_SETUP_FAILED=false" >> "$GITHUB_ENV"
            echo "Database setup completed successfully."
          fi

      - name: Add repo root to PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: DAL smoke
        run: |
          set +e
          python -m scripts.dal_smoke > dal-smoke.log 2>&1
          DAL_SMOKE_EXIT_CODE=$?
          set -e

          if [ $DAL_SMOKE_EXIT_CODE -ne 0 ]; then
            echo "DAL_SMOKE_FAILED=true" >> "$GITHUB_ENV"
            echo "DAL smoke test failed. Check dal-smoke.log for details."
            cat dal-smoke.log
            exit $DAL_SMOKE_EXIT_CODE
          else
            echo "DAL_SMOKE_FAILED=false" >> "$GITHUB_ENV"
            echo "DAL smoke test passed."
          fi

      - name: CI smoke
        run: |
          set +e
          python -m scripts.ci_smoke > ci-smoke.log 2>&1
          CI_SMOKE_EXIT_CODE=$?
          set -e

          if [ $CI_SMOKE_EXIT_CODE -ne 0 ]; then
            echo "CI_SMOKE_FAILED=true" >> "$GITHUB_ENV"
            echo "CI smoke test failed. Check ci-smoke.log for details."
            cat ci-smoke.log
            exit $CI_SMOKE_EXIT_CODE
          else
            echo "CI_SMOKE_FAILED=false" >> "$GITHUB_ENV"
            echo "CI smoke test passed."
          fi

      - name: Unit tests
        run: |
          set +e
          pytest -q --tb=short --junitxml=pytest-results.xml > pytest-output.log 2>&1
          PYTEST_EXIT_CODE=$?
          set -e

          if [ $PYTEST_EXIT_CODE -ne 0 ]; then
            echo "PYTEST_FAILED=true" >> "$GITHUB_ENV"
            echo "Unit tests failed. Check pytest-output.log for details."
            cat pytest-output.log
            exit $PYTEST_EXIT_CODE
          else
            echo "PYTEST_FAILED=false" >> "$GITHUB_ENV"
            echo "All unit tests passed."
          fi

      - name: Upload DB validation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: db-validation-failure-logs
          path: |
            db-setup.log
            dal-smoke.log
            ci-smoke.log
            pytest-output.log
            pytest-results.xml
          if-no-files-found: ignore

      - name: Summary – Data model validation
        if: always()
        run: |
          {
            printf '## Database Validation: **%s**\n\n' "${{ job.status }}"

            # Database setup
            printf '### 🗄️ Database Setup\n'
            if [ "${DB_SETUP_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>Setup error details</summary>\n\n'
              printf '```\n'
              cat db-setup.log 2>/dev/null || echo "No setup log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # DAL smoke test
            printf '\n### 🔧 DAL Smoke Test\n'
            if [ "${DAL_SMOKE_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>DAL smoke test errors</summary>\n\n'
              printf '```\n'
              cat dal-smoke.log 2>/dev/null || echo "No DAL smoke log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # CI smoke test
            printf '\n### 🚀 CI Smoke Test\n'
            if [ "${CI_SMOKE_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>CI smoke test errors</summary>\n\n'
              printf '```\n'
              cat ci-smoke.log 2>/dev/null || echo "No CI smoke log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # Unit tests
            printf '\n### 🧪 Unit Tests\n'
            if [ "${PYTEST_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>Test failures</summary>\n\n'
              printf '```\n'
              cat pytest-output.log 2>/dev/null || echo "No pytest log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            # Overall summary
            printf '\n---\n'
            if [ "${{ job.status }}" = "success" ]; then
              printf '🎉 All database validation checks passed!\n'
            else
              printf '❌ Database validation failed. Please review the details above.\n'
              printf '\n**Next steps:**\n'
              printf '1. Check the MySQL service is running correctly\n'
              printf '2. Verify database schema scripts in `db/` directory\n'
              printf '3. Review failing tests and fix data access layer issues\n'
              printf '4. Run tests locally: `python -m scripts.setup_db && pytest`\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  ui-logic-validate:
    name: Validate UI & Logic
    needs: [lint, db-validate]
    if: >-
      ${{
        github.event.inputs.run_all == 'true' ||
        (
          needs.detect.outputs.ui_logic_changed == 'true' &&
          (needs.detect.outputs.db_changed != 'true' ||
          needs['db-validate'].result == 'success')
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install deps
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-qt

      - name: Add repo root to PYTHONPATH
        run: echo "PYTHONPATH=$PWD" >> $GITHUB_ENV

      - name: UI/logic tests
        run: |
          set +e
          pytest -q tests -k "not db and not schema" --tb=short \
            --junitxml=ui-pytest-results.xml > ui-pytest-output.log 2>&1
          UI_PYTEST_EXIT_CODE=$?
          set -e

          if [ $UI_PYTEST_EXIT_CODE -ne 0 ]; then
            echo "UI_PYTEST_FAILED=true" >> "$GITHUB_ENV"
            echo "UI/Logic tests failed. Check ui-pytest-output.log for details."
            cat ui-pytest-output.log
            exit $UI_PYTEST_EXIT_CODE
          else
            echo "UI_PYTEST_FAILED=false" >> "$GITHUB_ENV"
            echo "All UI/Logic tests passed."
          fi

      - name: Upload UI validation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-validation-failure-logs
          path: |
            ui-pytest-output.log
            ui-pytest-results.xml
          if-no-files-found: ignore

      - name: Summary – UI/Logic
        if: always()
        run: |
          {
            printf '## UI/Logic Validation: **%s**\n\n' "${{ job.status }}"

            printf '### 🖥️ UI and Logic Tests\n'
            if [ "${UI_PYTEST_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>Test failures</summary>\n\n'
              printf '```\n'
              cat ui-pytest-output.log 2>/dev/null || echo "No UI test log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
            fi

            printf '\n---\n'
            if [ "${{ job.status }}" = "success" ]; then
              printf '🎉 All UI/Logic validation checks passed!\n'
            else
              printf '❌ UI/Logic validation failed. Please review the details above.\n'
              printf '\n**Next steps:**\n'
              printf '1. Review failing UI/Logic tests\n'
              printf '2. Check PyQt5 dependencies and imports\n'
              printf '3. Verify UI components and business logic\n'
              printf '4. Run tests locally: `pip install pytest pytest-qt && pytest tests -k "not db"`\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-macos:
    name: Build macOS app
    needs: [lint, db-validate, ui-logic-validate]
    if: >-
      ${{
        github.event.inputs.run_all == 'true' ||
        (
          (needs['ui-logic-validate'].result == 'success') ||
          (needs.detect.outputs.ui_logic_changed != 'true')
        )
      }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install build deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.6.*
          brew install create-dmg || true

      - name: Build app bundle
        env:
          APP_ENTRY: app/main.py
          APP_NAME: the-studentr
        run: |
          set +e
          mkdir -p dist
          pyinstaller --noconfirm --windowed \
            --name "$APP_NAME" "$APP_ENTRY" > build.log 2>&1
          BUILD_EXIT_CODE=$?
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
            echo "PyInstaller build failed. Check build.log for details."
            cat build.log
            exit $BUILD_EXIT_CODE
          else
            echo "BUILD_FAILED=false" >> "$GITHUB_ENV"
            echo "Built app at dist/$APP_NAME.app"
            ls -la dist/
          fi

      - name: Create DMG
        continue-on-error: true
        env:
          APP_NAME: the-studentr
        run: |
          set +e
          if command -v create-dmg >/dev/null 2>&1; then
            create-dmg "dist/${APP_NAME}.dmg" "dist/${APP_NAME}.app" > dmg-creation.log 2>&1
            DMG_EXIT_CODE=$?
            if [ $DMG_EXIT_CODE -eq 0 ]; then
              echo "DMG_CREATED=true" >> "$GITHUB_ENV"
              echo "DMG created successfully."
            else
              echo "DMG_CREATED=false" >> "$GITHUB_ENV"
              echo "DMG creation failed, but continuing..."
              cat dmg-creation.log
            fi
          else
            echo "DMG_CREATED=false" >> "$GITHUB_ENV"
            echo "create-dmg not available; skipping DMG step."
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build
          path: |
            dist/*.app
            dist/*.dmg
          if-no-files-found: warn

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macOS-build-failure-logs
          path: |
            build.log
            dmg-creation.log
          if-no-files-found: ignore

      - name: Summary – Build
        if: always()
        run: |
          {
            printf '## macOS Build: **%s**\n\n' "${{ job.status }}"

            # Build information
            printf '### 🔨 PyInstaller Build\n'
            if [ "${BUILD_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>Build error details</summary>\n\n'
              printf '```\n'
              cat build.log 2>/dev/null || echo "No build log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
              if [ -d "dist" ]; then
                printf '**Built files:**\n'
                printf '```\n'
                ls -la dist/ 2>/dev/null || echo "No dist directory found"
                printf '\n```\n'
              fi
            fi

            # DMG creation
            printf '\n### 📦 DMG Creation\n'
            if [ "${DMG_CREATED:-false}" = "true" ]; then
              printf '**Status:** ✅ Created successfully\n'
            else
              printf '**Status:** ⚠️ Skipped or failed (non-critical)\n'
              if [ -f dmg-creation.log ]; then
                printf '<details><summary>DMG creation log</summary>\n\n'
                printf '```\n'
                cat dmg-creation.log
                printf '\n```\n'
                printf '</details>\n'
              fi
            fi

            printf '\n---\n'
            if [ "${{ job.status }}" = "success" ]; then
              printf '🎉 macOS build completed successfully!\n'
              printf '- Artifacts: .app bundle'
              if [ "${DMG_CREATED:-false}" = "true" ]; then
                printf ' and .dmg installer'
              fi
              printf '\n'
            else
              printf '❌ macOS build failed. Please review the details above.\n'
              printf '\n**Next steps:**\n'
              printf '1. Check PyInstaller compatibility with dependencies\n'
              printf '2. Verify all Python modules are properly bundled\n'
              printf '3. Test build locally: `pip install pyinstaller && pyinstaller --windowed app/main.py`\n'
              printf '4. Check for missing system libraries or Qt dependencies\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    name: Build Windows app
    needs: [lint, db-validate, ui-logic-validate]
    if: >-
      ${{
        github.event.inputs.run_all == 'true' ||
        (
          (needs['ui-logic-validate'].result == 'success') ||
          (needs.detect.outputs.ui_logic_changed != 'true')
        )
      }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install build deps
        run: |
          pip install -r requirements.txt
          pip install pyinstaller==6.6.*

      - name: Build Windows executable
        env:
          APP_ENTRY: app/main.py
          APP_NAME: the-studentr
        shell: bash
        run: |
          set +e
          mkdir -p dist
          pyinstaller --noconfirm --windowed \
            --name "$APP_NAME" "$APP_ENTRY" > build.log 2>&1
          BUILD_EXIT_CODE=$?
          set -e

          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "BUILD_FAILED=true" >> "$GITHUB_ENV"
            echo "PyInstaller build failed. Check build.log for details."
            cat build.log
            exit $BUILD_EXIT_CODE
          else
            echo "BUILD_FAILED=false" >> "$GITHUB_ENV"
            echo "Built app at dist/$APP_NAME.exe"
            ls -la dist/
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build
          path: |
            dist/*.exe
            dist/${{ env.APP_NAME }}/
          if-no-files-found: warn

      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-failure-logs
          path: |
            build.log
          if-no-files-found: ignore

      - name: Summary – Build
        if: always()
        shell: bash
        run: |
          {
            printf '## Windows Build: **%s**\n\n' "${{ job.status }}"

            # Build information
            printf '### 🔨 PyInstaller Build\n'
            if [ "${BUILD_FAILED:-false}" = "true" ]; then
              printf '**Status:** ❌ Failed\n\n'
              printf '<details><summary>Build error details</summary>\n\n'
              printf '```\n'
              cat build.log 2>/dev/null || echo "No build log found"
              printf '\n```\n'
              printf '</details>\n'
            else
              printf '**Status:** ✅ Passed\n'
              if [ -d "dist" ]; then
                printf '**Built files:**\n'
                printf '```\n'
                ls -la dist/ 2>/dev/null || echo "No dist directory found"
                printf '\n```\n'
              fi
            fi

            printf '\n---\n'
            if [ "${{ job.status }}" = "success" ]; then
              printf '🎉 Windows build completed successfully!\n'
              printf '- Artifacts: .exe executable and supporting files\n'
            else
              printf '❌ Windows build failed. Please review the details above.\n'
              printf '\n**Next steps:**\n'
              printf '1. Check PyInstaller compatibility with dependencies\n'
              printf '2. Verify all Python modules are properly bundled\n'
              printf '3. Test build locally: `pip install pyinstaller && pyinstaller --windowed app/main.py`\n'
              printf '4. Check for missing system libraries or Qt dependencies\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  pipeline-summary:
    name: Pipeline Summary
    needs: [detect, lint, plantuml, db-validate, ui-logic-validate, build-macos, build-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect job results
        env:
          DETECT_STATUS: ${{ needs.detect.result }}
          LINT_STATUS: ${{ needs.lint.result }}
          PLANTUML_STATUS: ${{ needs.plantuml.result }}
          DB_VALIDATE_STATUS: ${{ needs.db-validate.result }}
          UI_LOGIC_STATUS: ${{ needs.ui-logic-validate.result }}
          BUILD_MACOS_STATUS: ${{ needs.build-macos.result }}
          BUILD_WINDOWS_STATUS: ${{ needs.build-windows.result }}
        run: |
          {
            printf '# 🚀 Pipeline Summary\n\n'
            printf '## Job Results\n\n'
            printf '| Job | Status | Notes |\n'
            printf '|-----|--------|-------|\n'

            # Detect job
            if [ "$DETECT_STATUS" = "success" ]; then
              printf '| 🔍 Change Detection | ✅ Success | Changes detected and analyzed |\n'
            else
              printf '| 🔍 Change Detection | ❌ Failed | Change detection failed |\n'
            fi

            # Lint job
            if [ "$LINT_STATUS" = "success" ]; then
              printf '| 🧹 Lint | ✅ Success | All linting checks passed |\n'
            elif [ "$LINT_STATUS" = "failure" ]; then
              printf '| 🧹 Lint | ❌ Failed | Code quality issues found |\n'
            else
              printf '| 🧹 Lint | ⏭️ Skipped | No relevant changes |\n'
            fi

            # PlantUML job
            if [ "$PLANTUML_STATUS" = "success" ]; then
              printf '| 📊 UML Rendering | ✅ Success | Diagrams updated |\n'
            elif [ "$PLANTUML_STATUS" = "failure" ]; then
              printf '| 📊 UML Rendering | ❌ Failed | Diagram rendering failed |\n'
            else
              printf '| 📊 UML Rendering | ⏭️ Skipped | No UML changes |\n'
            fi

            # Database validation
            if [ "$DB_VALIDATE_STATUS" = "success" ]; then
              printf '| 🗄️ Database Validation | ✅ Success | All DB tests passed |\n'
            elif [ "$DB_VALIDATE_STATUS" = "failure" ]; then
              printf '| 🗄️ Database Validation | ❌ Failed | Database or DAL issues |\n'
            else
              printf '| 🗄️ Database Validation | ⏭️ Skipped | No DB changes |\n'
            fi

            # UI/Logic validation
            if [ "$UI_LOGIC_STATUS" = "success" ]; then
              printf '| 🖥️ UI/Logic Validation | ✅ Success | All UI tests passed |\n'
            elif [ "$UI_LOGIC_STATUS" = "failure" ]; then
              printf '| 🖥️ UI/Logic Validation | ❌ Failed | UI or logic issues |\n'
            else
              printf '| 🖥️ UI/Logic Validation | ⏭️ Skipped | No UI changes |\n'
            fi

            # Build - macOS
            if [ "$BUILD_MACOS_STATUS" = "success" ]; then
              printf '| 🍎 macOS Build | ✅ Success | Application built successfully |\n'
            elif [ "$BUILD_MACOS_STATUS" = "failure" ]; then
              printf '| 🍎 macOS Build | ❌ Failed | Build errors occurred |\n'
            else
              printf '| 🍎 macOS Build | ⏭️ Skipped | No build trigger |\n'
            fi

            # Build - Windows
            if [ "$BUILD_WINDOWS_STATUS" = "success" ]; then
              printf '| 🪟 Windows Build | ✅ Success | Application built successfully |\n'
            elif [ "$BUILD_WINDOWS_STATUS" = "failure" ]; then
              printf '| 🪟 Windows Build | ❌ Failed | Build errors occurred |\n'
            else
              printf '| 🪟 Windows Build | ⏭️ Skipped | No build trigger |\n'
            fi

            printf '\n## Overall Status\n\n'

            # Determine overall status
            if [[ "$LINT_STATUS" == "failure" || "$DB_VALIDATE_STATUS" == "failure" ||\
                  "$UI_LOGIC_STATUS" == "failure" || "$BUILD_MACOS_STATUS" == "failure" ||\
                  "$BUILD_WINDOWS_STATUS" == "failure" ]]; then
              printf '❌ **Pipeline Failed**\n\n'
              printf 'One or more critical jobs failed. Please review the individual job summaries\n'
              printf 'above for detailed error information.\n\n'
              printf '### Recommended Actions:\n'
              printf '1. Check the failing job details for specific errors\n'
              printf '2. Download failure artifacts for detailed logs\n'
              printf '3. Fix issues locally and test before pushing\n'
              printf '4. Re-run the pipeline after fixes\n'
            else
              printf '✅ **Pipeline Successful**\n\n'
              printf 'All critical jobs completed successfully. The code is ready for deployment.\n\n'
              if [ "$PLANTUML_STATUS" = "failure" ]; then
                printf '⚠️ Note: UML rendering failed (non-critical)\n'
              fi
            fi

            printf '\n### Pipeline Artifacts\n'
            printf 'Available artifacts from this run:\n'
            printf '- **Success artifacts**: Built applications and rendered diagrams\n'
            printf '- **Failure artifacts**: Detailed logs and test results for debugging\n'

            printf '\n---\n'
            printf '_Pipeline completed at %s_\n' "$(date --iso-8601=seconds)"
          } >> "$GITHUB_STEP_SUMMARY"
